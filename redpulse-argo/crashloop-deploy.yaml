apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app-deploy
  labels:
    app: crashloop-app
spec:
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: crashloop-app
  replicas: 1
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
      - name: crashloop-container
        image: quay.io/fxiang1/helloworld:this-tag-does-not-exist
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
